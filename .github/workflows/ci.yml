# CI: lint and test every pull request (and the weekly/manual rebuilds);
# build the production image for linux/amd64 (ADR 0006): on pull requests in
# parallel with the tests (build only), on main build and push to GHCR.
# A weekly scheduled run rebuilds main with a fresh base image so security
# fixes in python:3.14-slim reach `latest` between merges (#32).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Mondays 03:30 UTC. Scheduled runs always use the default branch.
  schedule:
    - cron: "30 3 * * 1"
  # Manual rebuild, e.g. after an urgent base image fix.
  workflow_dispatch:

# Pull requests: a new push cancels the running check of the same PR.
# main: runs are never cancelled but queued, so every merge gets its image
# (sha-<commit>) and `latest` is always pushed in merge order (#26). GitHub
# keeps at most one pending run per group: with three or more merges in a few
# minutes, the middle pending run is replaced by the newest one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Not on pushes to main (#51): every merge was tested on its pull request,
  # and the ruleset "protect main" requires PR branches to be up to date
  # with main, so the tested state is exactly what lands on main. The weekly
  # scheduled rebuild and manual runs still test (new base image, no PR).
  test:
    name: Lint and test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vrobot
          POSTGRES_PASSWORD: vrobot
          POSTGRES_DB: vrobot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vrobot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # CI-only values; no real secrets needed for tests.
      SECRET_KEY: ci-only-not-secret
      DEBUG: "false"
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://vrobot:vrobot@localhost:5432/vrobot

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag, so pin the exact version.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run python manage.py test

  # Pull requests: build only, to verify the Dockerfile on amd64. Runs at the
  # same time as the tests (#50); nothing is pushed, so it needs no gate.
  # The job name is a required check in the ruleset "protect main".
  image:
    name: Build image (linux/amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `pull` always fetches the current base image; a new base digest
      # invalidates the layer cache.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          pull: true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main (push, schedule, manual run on main): build and push to GHCR. Every
  # image that reaches the server (automatic deploy, ADR 0012) has been
  # tested: pushes on their pull request, schedule and manual runs by the
  # test job of the same run, which this job waits for. A skipped test job
  # (push) does not block it, a failed or cancelled one does.
  publish:
    name: Publish image (linux/amd64)
    if: >-
      !cancelled()
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown by the website at /version.
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
