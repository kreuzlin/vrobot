[project]
name = "vrobot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.1",
    "markdown>=3.11.3",
    "nh3>=0.3.8",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # German text legitimately uses typographic characters (–, «»)
    "RUF002",
    "RUF003",
    "RUF012",  # Django declares options as class-level lists (admin, Meta)
]
