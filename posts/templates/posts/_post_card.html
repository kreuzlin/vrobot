{# Teaser for lists. Expects `post`. The whole card is clickable via the title link. #}
<article class="post-card">
  {% if post.image %}
    <img src="{{ post.image.url }}" alt="" loading="lazy">
  {% else %}
    <div class="post-card-noimage" aria-hidden="true"></div>
  {% endif %}
  <div class="post-card-body">
    <p class="post-meta"><time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"j. F Y" }}</time></p>
    <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
    <p>{{ post.get_meta_description }}</p>
  </div>
</article>
